<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Item - StockVision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/dashboard" class="navbar-brand">StockVision</a>
      <nav class="navbar-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/inventory" class="active">Inventory</a>
        <a href="/reminders">Reminders</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="page-header">
      <h1>Add Inventory Item</h1>
      <p>Create a new product record</p>
    </section>

    <section class="card form-card">
      <form class="form" id="addItemForm">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="e.g. Wireless Mouse" required>
          </div>
          <div class="form-group">
            <label for="sku">SKU</label>
            <input id="sku" name="sku" type="text" placeholder="e.g. WM-001" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" min="0" placeholder="0" required>
          </div>
          <div class="form-group">
            <label for="threshold">Threshold</label>
            <input id="threshold" name="threshold" type="number" min="0" placeholder="0" required>
          </div>
        </div>
        <div class="form-actions">
          <div class="admin-only">
            <button type="submit" class="btn btn-primary">Save Item</button>
          </div>
          <a href="/inventory" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </section>
  </main>
  <script src="/static/js/add-inventory.js"></script>
</body>
</html>
