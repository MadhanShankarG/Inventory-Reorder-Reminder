<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/static/css/style.css">
  <title>Login - StockVision</title>
</head>

<body>
  <main>
    <form id="loginForm">
      <input name="username" placeholder="username" required />
      <input name="password" type="password" placeholder="password" required />
      <button type="submit">Login</button>
    </form>
    <div id="loginError" style="color: red;"></div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = { username: f.username.value.trim(), password: f.password.value };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const json = await res.json();
        if (res.ok && json.success && json.token) {
          sessionStorage.setItem('jwt', json.token);
          window.location.href = '/dashboard';
        } else {
          document.getElementById('loginError').innerText = json.message || 'Login failed';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('loginError').innerText = 'Network error';
      }
    });
  </script>
</body>

</html>
